name: Site check

# Runs on every push and pull request that touches the site,
# so a broken file is caught before it goes live.
on:
  push:
    paths: ['site/**', 'scripts/**', '.github/workflows/check.yml']
  pull_request:
    paths: ['site/**', 'scripts/**', '.github/workflows/check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
