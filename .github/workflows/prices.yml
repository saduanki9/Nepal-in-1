name: Weekly market prices

# Every Sunday morning (09:02 Nepal time), read Kalimati market's wholesale prices
# for the Mentor's tomato, banana and fish cards, save them in site/data.json,
# and publish the site. Runs on GitHub's free runners; it uses no Claude usage.
# If Kalimati can't be read, the run fails, GitHub emails the repo owner, and
# the site keeps last week's prices.
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read this week's Kalimati prices and save them
        id: save
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2; do
            python3 scripts/update_prices.py
            node scripts/check.mjs
            if git diff --quiet -- site/data.json; then
              echo "No change in prices."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add site/data.json
            git commit -q -m "Update weekly market prices from Kalimati"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved while saving; starting again from the latest main."
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "Could not save after two attempts." >&2
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.save.outputs.changed == 'true'
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
